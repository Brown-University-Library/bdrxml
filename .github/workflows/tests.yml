name: CI tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python-version: ["3.8", "3.9", "3.10"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # eulxml imports pkg_resources, which setuptools removed in version 82.
          python -m pip install "setuptools<82" wheel
          python -m pip install -r requirements.txt coverage .
          python -m pip check
      - name: Run tests with coverage
        run: python -m coverage run --source=bdrxml run_tests.py

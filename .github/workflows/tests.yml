name: CI tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python-version: ["3.12.16", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --group ci_tests
      - name: Run tests
        run: uv run ./run_tests.py
      - name: Build wheel and source archive
        run: uv build
      - name: Test the installed wheel outside the source tree
        run: |
          package_path="$PWD/dist/bdrxml-2.0.0-py3-none-any.whl"
          test_directory=$(mktemp -d)
          cp -R test run_tests.py "$test_directory/"
          uv run --no-project --with "$package_path" --directory "$test_directory" python run_tests.py

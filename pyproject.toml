[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[project]
name = "bdrxml"
version = "2.0.0"
description = "Reads and writes XML metadata for the Brown Digital Repository."
readme = "README.md"
requires-python = ">=3.12.16"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Brown University Library", email = "bdr@brown.edu"}]
dependencies = [
    "neuxml~=1.0.0",
    "lxml~=6.1.3",
    "ply~=3.11",
    "rdflib~=7.6.0",
]

[project.urls]
Repository = "https://github.com/Brown-University-Library/bdrxml"

[dependency-groups]
local = [
    "types-lxml>=2026.2.16",
]
staging = []
prod = []
ci_tests = []

[tool.uv.build-backend]
module-root = ""
source-include = ["test/**", "run_tests.py", "typings/**", "ruff.toml", "uv.lock"]
source-exclude = [".DS_Store"]

[tool.uv]
required-version = ">=0.13.6"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
